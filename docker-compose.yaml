services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file: [".env"]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
